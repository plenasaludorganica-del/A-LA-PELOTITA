<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--PAGE-->
<title>A la Pelotita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: una sola pantalla; la cancha 3D ocupa todo y los menús flotan encima como paneles de vidrio */
:root {
  color-scheme: dark;
  --bg: #120A33; --ink: #FFFFFF; --ink-soft: #CFC6F5; --panel: rgba(24, 13, 66, .86); --panel-line: rgba(255, 255, 255, .16);
  --amber: #FFB020; --pink: #FF3D8B; --cyan: #22E1FF; --lime: #D8FF3A; --violet: #7B4DFF; --red: #FF5252;
  --display: 'Lilita One', 'Arial Black', Impact, sans-serif;
  --body: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 800; font-size: 16px;
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#gl, #swipe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#swipe { pointer-events: none; }
.layer { position: absolute; inset: 0; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
svg.ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
h1, h2, h3, .disp { font-family: var(--display); font-weight: 400; letter-spacing: .02em; margin: 0; text-wrap: balance; }

/* Botones con volumen */
.btn { font-family: var(--display); font-size: 20px; color: #1b1033; background: var(--amber); border: 0; border-radius: 18px;
  padding: 12px 22px; min-height: 52px; cursor: pointer; box-shadow: 0 6px 0 #B36B00, 0 10px 24px rgba(0, 0, 0, .35);
  transition: transform .08s, box-shadow .08s, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #B36B00, 0 3px 8px rgba(0, 0, 0, .35); }
.btn:focus-visible, .node:focus-visible, .chip:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.btn.pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 #A8134F, 0 10px 24px rgba(0, 0, 0, .35); }
.btn.cyan { background: var(--cyan); box-shadow: 0 6px 0 #0D8FA8, 0 10px 24px rgba(0, 0, 0, .35); }
.btn.lime { background: var(--lime); box-shadow: 0 6px 0 #7FA000, 0 10px 24px rgba(0, 0, 0, .35); }
.btn.ghost { background: rgba(255, 255, 255, .12); color: #fff; box-shadow: 0 6px 0 rgba(0, 0, 0, .35); }
.btn.big { font-size: 30px; padding: 16px 34px; min-height: 72px; border-radius: 24px; }
.btn.small { font-size: 15px; min-height: 44px; padding: 8px 14px; border-radius: 14px; }
.btn[disabled] { filter: grayscale(1) brightness(.7); pointer-events: none; }
.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); filter: brightness(1.15); } }

/* Barra superior */
#top { position: absolute; left: var(--gutter-l); right: var(--gutter-r); top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 6; }
.chip { background: var(--panel); border: 2px solid var(--panel-line); border-radius: 999px; padding: 6px 12px; min-height: 40px; box-sizing: border-box;
  display: inline-flex; align-items: center; gap: 6px; font-size: 16px; color: #fff; font-family: var(--body); font-weight: 900; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip small { font-size: 12px; color: var(--ink-soft); font-weight: 800; }
.chip.plus::after { content: '+'; background: var(--lime); color: #1b1033; border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; font-size: 16px; line-height: 1; }
.spacer { flex: 1; }
#top { flex-wrap: nowrap; }
@media (max-width: 420px) { .chip { padding: 6px 9px; gap: 4px; font-size: 15px; } .chip.plus::after { width: 17px; height: 17px; font-size: 14px; } }
#rank { flex-direction: column; align-items: stretch; gap: 3px; border-radius: 14px; padding: 6px 12px; min-width: 130px; align-self: flex-start; margin-top: 62px; font-size: 13px; }
#rank b { font-family: var(--display); font-weight: 400; font-size: 15px; color: var(--amber); }
.bar { height: 6px; background: rgba(255, 255, 255, .16); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--lime)); width: 0; transition: width .5s; }

/* Pantallas */
.screen { display: flex; flex-direction: column; align-items: center; z-index: 4; }
.screen[hidden] { display: none; }
#home { justify-content: flex-end; gap: 14px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  background: linear-gradient(180deg, rgba(18, 10, 51, .0) 30%, rgba(18, 10, 51, .78) 78%); }
.logo { font-family: var(--display); text-align: center; line-height: .88; font-size: clamp(44px, 13vw, 92px); color: #fff;
  text-shadow: 0 5px 0 #6a1b9a, 0 9px 0 rgba(0, 0, 0, .35), 0 0 40px rgba(255, 61, 139, .7); transform: rotate(-3deg); margin-top: auto; }
.logo .br { color: var(--amber); }
.logo .o { display: inline-block; width: .62em; height: .62em; border-radius: 50%; margin: 0 .02em; vertical-align: -0.02em;
  background: radial-gradient(circle at 32% 30%, #F6FFB0, var(--lime) 45%, #9CC400); box-shadow: 0 0 22px var(--lime), inset -4px -6px 0 rgba(0, 0, 0, .12);
  animation: boing 1.4s ease-in-out infinite; }
.logo .o:nth-of-type(2) { animation-delay: .25s; }
@keyframes boing { 0%, 100% { transform: translateY(0) scale(1.05, .95); } 45% { transform: translateY(-.26em) scale(.96, 1.05); } }
.logo small { display: block; font-size: .26em; letter-spacing: .28em; color: var(--cyan); text-shadow: 0 2px 0 rgba(0, 0, 0, .5); margin-top: .5em; transform: rotate(3deg); }
#hero { height: min(34vh, 300px); filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .5)); animation: float 3s ease-in-out infinite; image-rendering: pixelated; margin-bottom: -6px; }
@keyframes float { 50% { transform: translateY(-10px) rotate(1.5deg); } }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tagline { color: var(--ink-soft); font-size: 15px; text-align: center; max-width: 34ch; margin: 0; }

/* Paneles */
.sheet { justify-content: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 66px); background: rgba(12, 6, 38, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet > header { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.sheet > header h2 { font-size: 30px; flex: 1; text-shadow: 0 3px 0 rgba(0, 0, 0, .4); }
.scroll { width: 100%; max-width: 560px; flex: 1; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; padding-bottom: 30px; box-sizing: border-box; scrollbar-width: thin; min-height: 0; }
.card { background: var(--panel); border: 2px solid var(--panel-line); border-radius: 22px; padding: 14px; margin-bottom: 12px; }
.card p { margin: 4px 0; color: var(--ink-soft); font-size: 15px; }

/* Mapa de niveles */
#mapList { display: flex; flex-direction: column-reverse; align-items: center; position: relative; padding: 20px 0 40px; }
#mapList::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 6px; margin-left: -3px;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .35) 0 14px, transparent 14px 28px); border-radius: 3px; }
.wb { width: 100%; box-sizing: border-box; text-align: center; border-radius: 22px; padding: 14px 12px; margin: 18px 0; position: relative; z-index: 1;
  background-size: cover; background-position: center 30%; border: 3px solid var(--wc); box-shadow: 0 0 24px var(--wc); text-shadow: 0 3px 0 rgba(0, 0, 0, .7), 0 0 12px rgba(0, 0, 0, .9); }
.wb h3 { font-size: 26px; } .wb span { font-size: 14px; }
.noderow { height: 96px; width: 100%; display: flex; justify-content: center; position: relative; z-index: 1; }
.node { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; background: var(--wc); color: #1b1033; font-family: var(--display); font-size: 28px;
  cursor: pointer; position: relative; box-shadow: 0 7px 0 rgba(0, 0, 0, .45), 0 0 22px var(--wc); transform: translateX(var(--dx)); display: grid; place-items: center; padding: 0; }
.node:active { transform: translateX(var(--dx)) translateY(5px); box-shadow: 0 2px 0 rgba(0, 0, 0, .45); }
.node.boss { width: 92px; height: 92px; border-radius: 26px; background: linear-gradient(135deg, #FFD23A, var(--pink)); font-size: 20px; }
.node.locked { background: #3a3160; color: #8d84b8; border-color: #6b62a0; box-shadow: 0 7px 0 rgba(0, 0, 0, .45); }
.node.cur { animation: cur 1s ease-in-out infinite; }
@keyframes cur { 50% { box-shadow: 0 7px 0 rgba(0, 0, 0, .45), 0 0 0 12px rgba(255, 255, 255, .22), 0 0 34px var(--wc); } }
.node .st { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; font-size: 15px; color: #5d5488; }
.node .st .on { color: #FFD23A; filter: drop-shadow(0 0 4px #FFB020); }
.node .ty { position: absolute; top: -12px; right: -12px; background: #fff; color: #1b1033; border-radius: 10px; font-size: 11px; padding: 2px 6px; font-family: var(--body); font-weight: 900; }

/* Personajes */
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ch { background: var(--panel); border: 3px solid var(--panel-line); border-radius: 22px; padding: 10px; text-align: center; cursor: pointer; position: relative; overflow: hidden; color: #fff; font: inherit; }
.ch.sel { border-color: var(--ac); box-shadow: 0 0 24px var(--ac); }
.ch img { height: 150px; image-rendering: pixelated; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .5)); }
.ch.lock img { filter: brightness(.35) saturate(.4); }
.ch h3 { font-size: 22px; color: var(--ac); }
.ch .pr { font-size: 14px; display: inline-flex; gap: 4px; align-items: center; background: rgba(0, 0, 0, .35); border-radius: 999px; padding: 3px 10px; margin-top: 4px; }
.stat { display: grid; grid-template-columns: 96px 1fr 34px auto; gap: 8px; align-items: center; margin: 8px 0; font-size: 15px; }
.stat .bar { height: 12px; border-radius: 6px; } .stat .bar i { background: linear-gradient(90deg, var(--amber), var(--pink)); }
.stat small { grid-column: 1 / -1; color: var(--ink-soft); font-size: 12px; margin-top: -6px; }

/* Tienda y misiones */
.item { display: flex; align-items: center; gap: 12px; }
.item .gfx { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; flex: none; background: var(--c); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .2), 0 0 18px var(--c); color: #fff; }
.item .tx { flex: 1; min-width: 0; } .item h3 { font-size: 20px; }
.badge { display: inline-block; background: var(--pink); color: #fff; font-size: 11px; border-radius: 8px; padding: 2px 7px; margin-left: 6px; vertical-align: middle; font-family: var(--body); font-weight: 900; }
.note { font-size: 13px; color: var(--ink-soft); text-align: center; margin: 4px 0 14px; }

/* Modales */
.modal { z-index: 20; display: grid; place-items: center; background: rgba(8, 4, 28, .7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal[hidden] { display: none; }
.box { width: min(440px, 100%); max-height: 92%; overflow-y: auto; touch-action: pan-y; box-sizing: border-box; background: linear-gradient(180deg, #2c1a7a, #180d4a); border: 3px solid rgba(255, 255, 255, .25);
  border-radius: 28px; padding: 22px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 50px rgba(123, 77, 255, .5); animation: popin .35s cubic-bezier(.2, 1.6, .4, 1); display: flex; flex-direction: column; gap: 12px; align-items: center; }
@keyframes popin { from { transform: scale(.6); opacity: 0; } }
.box h2 { font-size: 34px; text-shadow: 0 4px 0 rgba(0, 0, 0, .4); } .box p { margin: 0; color: var(--ink-soft); }
.vs { display: flex; align-items: flex-end; justify-content: center; gap: 10px; width: 100%; }
.vs img { height: 150px; image-rendering: pixelated; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .5)); } .vs img:last-child { transform: scaleX(-1); }
.vs b { font-family: var(--display); font-size: 40px; color: var(--amber); font-weight: 400; padding-bottom: 40px; }
.stars { display: flex; gap: 8px; justify-content: center; font-size: 64px; color: #43397a; }
.stars .on { color: #FFD23A; filter: drop-shadow(0 0 14px #FFB020); animation: starpop .5s cubic-bezier(.2, 2, .4, 1) backwards; }
@keyframes starpop { from { transform: scale(0) rotate(-180deg); } }
.rew { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.rew span { background: rgba(0, 0, 0, .35); border-radius: 14px; padding: 8px 14px; font-size: 20px; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.day { background: rgba(0, 0, 0, .3); border-radius: 14px; padding: 8px 4px; font-size: 13px; border: 2px solid transparent; }
.day.done { opacity: .45; } .day.today { border-color: var(--lime); box-shadow: 0 0 16px var(--lime); background: rgba(216, 255, 58, .16); }
.day b { display: block; font-size: 17px; color: #fff; }
#chestGfx { width: 130px; height: 110px; border-radius: 22px; background: linear-gradient(180deg, #FFD23A, #E08A00); border: 5px solid #7a3d00; position: relative; cursor: pointer; box-shadow: 0 0 40px var(--amber); }
#chestGfx::before { content: ''; position: absolute; left: -5px; right: -5px; top: 34%; height: 10px; background: #7a3d00; }
#chestGfx::after { content: ''; position: absolute; left: 50%; top: 34%; width: 26px; height: 30px; margin: -8px 0 0 -13px; background: #fff3c4; border: 4px solid #7a3d00; border-radius: 6px; }
#chestGfx.shake { animation: shk .5s linear infinite; } @keyframes shk { 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }

/* HUD de juego */
#hud { z-index: 5; pointer-events: none; } #hud[hidden] { display: none; }
#score { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 2px solid var(--panel-line); border-radius: 20px; padding: 6px 16px; font-family: var(--display); white-space: nowrap; }
#score .n { font-size: 15px; color: var(--ink-soft); max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
#score .p { font-size: 40px; min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
#score .p.me { color: var(--lime); } #score .p.op { color: var(--pink); } #score .bump { animation: bump .4s; } @keyframes bump { 40% { transform: scale(1.7); } }
#goal { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 72px); left: 50%; transform: translateX(-50%); font-size: 13px; color: #fff; background: rgba(0, 0, 0, .4); padding: 3px 12px; border-radius: 999px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
#pauseBtn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: var(--gutter-r); pointer-events: auto; }
#combo { position: absolute; left: var(--gutter-l); top: 26%; font-family: var(--display); font-size: 44px; color: var(--amber); text-shadow: 0 4px 0 rgba(0, 0, 0, .5), 0 0 24px var(--amber); transform-origin: left center; opacity: 0; transition: opacity .3s; line-height: .9; }
#combo small { display: block; font-size: 16px; color: #fff; letter-spacing: .1em; }
#combo.on { opacity: 1; } #combo.hit { animation: bump .3s; }
#superBtn { position: absolute; right: var(--gutter-r); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 96px; height: 96px; border-radius: 50%; border: 0; pointer-events: auto; cursor: pointer;
  background: conic-gradient(var(--ac, var(--cyan)) calc(var(--pct, 0) * 1%), rgba(255, 255, 255, .16) 0); display: grid; place-items: center; padding: 0; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
#superBtn span { width: 78px; height: 78px; border-radius: 50%; background: #1b1033; display: grid; place-items: center; font-family: var(--display); font-size: 15px; color: #8d84b8; line-height: 1; text-align: center; }
#superBtn.full { animation: pulse .6s ease-in-out infinite; box-shadow: 0 0 34px var(--ac, var(--cyan)); } #superBtn.full span { background: var(--ac, var(--cyan)); color: #1b1033; font-size: 19px; }
#hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); transform: translateX(-50%); background: rgba(0, 0, 0, .55); border: 2px solid rgba(255, 255, 255, .3); border-radius: 16px; padding: 10px 16px; font-size: 16px; text-align: center; max-width: min(70%, 380px); }
#hint:empty { display: none; }
#extra { position: absolute; left: var(--gutter-l); top: calc(env(safe-area-inset-top, 0px) + 14px); font-size: 18px; display: flex; gap: 4px; align-items: center; background: var(--panel); border-radius: 999px; padding: 6px 12px; }
#extra:empty { display: none; }
#pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 7; }
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 26px; white-space: nowrap; text-shadow: 0 3px 0 rgba(0, 0, 0, .55), 0 0 16px currentColor; animation: popup .9s ease-out forwards; }
.pop.big { font-size: clamp(40px, 11vw, 84px); animation: popbig 1.3s cubic-bezier(.2, 1.4, .4, 1) forwards; text-align: center; white-space: normal; width: 94%; line-height: .95; }
.pop.perfect { color: var(--lime); font-size: 38px; } .pop.good { color: var(--cyan); } .pop.ok { color: #fff; opacity: .8; } .pop.bad { color: var(--red); } .pop.gold { color: #FFD23A; } .pop.pink { color: var(--pink); }
@keyframes popup { 0% { transform: translate(-50%, -30%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -70%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
@keyframes popbig { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.15) rotate(-4deg); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; } 100% { transform: translate(-50%, -60%) scale(1.3) rotate(-4deg); opacity: 0; } }
#flash { position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; z-index: 8; }
#lines { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 3; transition: opacity .25s;
  background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(255, 255, 255, .0) 0 4deg, rgba(255, 255, 255, .16) 4deg 5deg); -webkit-mask: radial-gradient(circle at 50% 45%, transparent 30%, #000 75%); mask: radial-gradient(circle at 50% 45%, transparent 30%, #000 75%); }
#toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); background: #fff; color: #1b1033; border-radius: 16px; padding: 10px 18px; z-index: 30; font-size: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); max-width: 86%; text-align: center; }
#toast[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .logo .o, #hero, .pulse, .node.cur { animation: none; } }
@media (max-height: 560px) { #hero { display: none; } .logo { font-size: 44px; } }
</style>
<!--/PAGE-->
</head>

  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="#FF3D8B" stroke="#fff" stroke-width="1.5" d="M12 21s-8.5-5.3-8.5-11.2A4.8 4.8 0 0112 6.6a4.8 4.8 0 018.5 3.2C20.500 15.700 12 21 12 21z"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD23A" stroke="#B36B00" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#B36B00" stroke-width="2"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path fill="#22E1FF" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M6 3h12l4 6-10 12L2 9z"/><path fill="#9cf3ff" d="M6 3l3 6h6l3-6z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10V7a5 5 0 0110 0v3h1.5v11h-13V10zm2.500 0h5V7a2.500 2.500 0 00-5 0z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h4v16H6zm8 0h4v16h-4z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9zm12.500-1.500v9a5 5 0 000-9z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9z"/><path stroke="currentColor" stroke-width="2.500" d="M15 9l6 6m0-6l-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round" d="M15 4l-8 8 8 8"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path fill="currentColor" d="M3 18l-1.500-11 5.500 4 5-7 5 7 5.500-4L21 18z"/></symbol>
</svg>

<div id="app">
  <canvas id="gl"></canvas>
  <div id="lines"></div>
  <canvas id="swipe"></canvas>

  <div id="hud" class="layer" hidden>
    <div id="extra"></div>
    <div id="score"><span class="n" id="nMe">Vos</span><span class="p me" id="pMe">0</span><span class="disp" style="opacity:.5">·</span><span class="p op" id="pOp">0</span><span class="n" id="nOp">Rival</span></div>
    <div id="goal"></div>
    <button class="chip" id="pauseBtn" aria-label="Pausa"><svg class="ic"><use href="#i-pause"/></svg></button>
    <div id="combo"><span id="comboN">x2</span><small>COMBO</small></div>
    <div id="hint"></div>
    <button id="superBtn" aria-label="Especial"><span id="superTx">ESPECIAL</span></button>
  </div>
  <div id="pops"></div>
  <div id="flash"></div>

  <div id="top">
    <button class="chip plus" id="cLives"><svg class="ic"><use href="#i-heart"/></svg><span id="vLives">5</span><small id="vLifeT"></small></button>
    <button class="chip plus" id="cCoins"><svg class="ic"><use href="#i-coin"/></svg><span id="vCoins">0</span></button>
    <button class="chip plus" id="cGems"><svg class="ic"><use href="#i-gem"/></svg><span id="vGems">0</span></button>
    <span class="spacer"></span>
    <button class="chip" id="soundBtn" aria-label="Sonido"><svg class="ic"><use id="soundIc" href="#i-sound"/></svg></button>
  </div>

  <section id="home" class="layer screen">
    <button class="chip" id="rank"><span>Categoría <b id="vRank">8va</b></span><div class="bar"><i id="vXp"></i></div></button>
    <h1 class="logo"><span class="br">[</span>A LA<br>PEL<span class="o"></span>TITA<span class="br">]</span><small>PÁDEL ARCADE</small></h1>
    <img id="hero" alt="">
    <button class="btn big lime pulse" id="playBtn">Jugar</button>
    <div class="row">
      <button class="btn ghost" id="bMap">Circuito</button>
      <button class="btn pink" id="bChars">Jugadores</button>
      <button class="btn cyan" id="bMissions">Misiones</button>
      <button class="btn" id="bShop">Tienda</button>
    </div>
    <p class="tagline">Deslizá para pegarle. Apuntá con la dirección. Cuando el aro se cierra, ¡es PERFECTO!</p>
  </section>

  <section id="map" class="layer screen sheet" hidden>
    <header><button class="btn small ghost" data-go="home" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button><h2>Circuito</h2><span class="chip"><svg class="ic" style="color:#FFD23A"><use href="#i-star"/></svg><span id="vStars">0</span></span></header>
    <div class="scroll" id="mapScroll"><div id="mapList"></div></div>
  </section>

  <section id="chars" class="layer screen sheet" hidden>
    <header><button class="btn small ghost" data-go="home" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button><h2>Jugadores</h2></header>
    <div class="scroll"><div class="chars" id="charGrid"></div><div class="card" id="charDetail" style="margin-top:12px"></div></div>
  </section>

  <section id="shop" class="layer screen sheet" hidden>
    <header><button class="btn small ghost" data-go="home" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button><h2>Tienda</h2></header>
    <div class="scroll"><p class="note">Versión demo: los pagos todavía no están conectados. Al tocar un precio se simula la compra y te lo acredita.</p><div id="shopList"></div></div>
  </section>

  <section id="missions" class="layer screen sheet" hidden>
    <header><button class="btn small ghost" data-go="home" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button><h2>Misiones de hoy</h2></header>
    <div class="scroll"><div id="missionList"></div><div class="card" id="chestCard"></div></div>
  </section>

  <div id="modal" class="layer modal" hidden><div class="box" id="modalBox"></div></div>
  <div id="toast" hidden></div>
</div>
